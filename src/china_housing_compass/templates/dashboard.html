<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · China Housing Compass</title>
  <style>
    :root { --ink:#17221d; --muted:#66736c; --paper:#f4f1e8; --card:#fffdf8; --line:#d9d5ca; --accent:#176b50; --warn:#a45224; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    header, main, footer { width:min(1180px, calc(100% - 32px)); margin:auto; }
    header { padding:34px 0 18px; display:flex; gap:20px; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { color:var(--accent); font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font:700 clamp(28px,5vw,48px)/1.08 Georgia,"Songti SC",serif; }
    .meta { color:var(--muted); text-align:right; max-width:440px; }
    main { padding:24px 0 50px; }
    .hero, section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; }
    .hero { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(240px,.6fr); gap:22px; }
    h2 { margin:0 0 13px; font:700 21px/1.2 Georgia,"Songti SC",serif; }
    .recommendation { color:var(--accent); font-size:32px; font-weight:800; text-transform:uppercase; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .metric { padding:14px; background:#f6f5ef; border-radius:12px; }
    .metric small { display:block; color:var(--muted); }
    .metric strong { display:block; font-size:20px; margin-top:3px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    th { color:var(--muted); font-weight:700; }
    .empty, .warning { color:var(--muted); padding:12px 0; }
    .warning { color:var(--warn); }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin:7px 0 4px; }
    .badge { display:inline-block; padding:2px 7px; border-radius:999px; background:#edf1eb; color:#385348; font-size:12px; font-weight:700; white-space:nowrap; }
    .badge-grade { background:#e7f1ea; color:#176b50; }
    .badge-state { background:#f3eee2; color:#715a20; }
    .badge-scope { background:#edf0f5; color:#475b73; }
    .badge-access { background:#edf1eb; color:#385348; }
    .badge-stale { background:#f8e8df; color:var(--warn); }
    .badge-unavailable { background:#f8e8df; color:var(--warn); }
    .evidence-meta { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .sample-run { border-top:1px solid var(--line); margin-top:12px; padding-top:4px; }
    h3 { margin:20px 0 8px; font-size:16px; }
    .chart { width:100%; height:auto; min-height:130px; }
    a { color:var(--accent); }
    footer { color:var(--muted); padding:0 0 34px; font-size:13px; }
    @media (max-width:760px) { header,.hero { display:block; } .meta { text-align:left; margin-top:12px; } .grid { grid-template-columns:1fr; } section,.hero { padding:17px; overflow:auto; } th,td { min-width:110px; } }
  </style>
</head>
<body>
  <header>
    <div><div class="brand">China Housing Compass</div><h1>{{TITLE}}</h1></div>
    <div class="meta">{{META}}</div>
  </header>
  <main>{{CONTENT}}</main>
  <footer>Evidence-backed ranges, not a guaranteed floor or investment promise. 数据有时效性，重大决策请核验原始官方资料。</footer>
</body>
</html>
