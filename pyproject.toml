[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "china-housing-compass"
version = "0.1.0"
description = "Open-source China housing-market analysis and home-purchase assessment toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "China Housing Compass contributors" }]
keywords = ["china", "housing", "real-estate", "valuation", "codex-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Office/Business :: Financial",
]

[project.scripts]
china-housing-compass = "china_housing_compass.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
china_housing_compass = ["schema.sql", "templates/*.html"]
